<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ardenia: Grand Strategy</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="game">
<div id="app">
  <header class="topbar">
    <div class="brand">ARDENIA <small>GRAND STRATEGY</small></div>
    <div id="topStats" class="topstats"></div>
    <div class="clock">
      <div id="dateLabel">1 January 1936</div>
      <button id="pauseBtn" class="button tiny">PAUSE</button>
      <button id="speedBtn" class="button tiny">SPEED 1×</button>
      <button id="nextDayBtn" class="button tiny">DAY +1</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar left">
      <section>
        <div class="panel-title">NATIONAL AGENDA</div>
        <div id="agendaPanel"></div>
      </section>
      <section>
        <div class="panel-title">ARMIES</div>
        <div id="armyPanel"></div>
      </section>
      <section>
        <div class="panel-title">PRODUCTION</div>
        <div id="productionPanel"></div>
      </section>
    </aside>

    <main class="center">
      <div class="toolbar">
        <button data-tab="map" class="tab active">MAP</button>
        <button data-tab="politics" class="tab">POLITICS</button>
        <button data-tab="research" class="tab">RESEARCH</button>
        <button data-tab="industry" class="tab">INDUSTRY</button>
        <button data-tab="diplomacy" class="tab">DIPLOMACY</button>
        <button data-tab="war" class="tab">WAR ROOM</button><button data-tab="army" class="tab">ARMY DESIGN</button><button data-tab="air" class="tab">AIR FORCE</button><button data-tab="navy" class="tab">NAVY</button>
        <button data-tab="ledger" class="tab">LEDGER</button>
      </div>

      <section id="mapTab" class="tabview active">
        <div class="map-toolbar">
          <button id="resetMap" class="button tiny">RESET MAP</button>
          <label><input id="showTerrain" type="checkbox"> terrain</label>
          <label><input id="showNames" type="checkbox" checked> names</label><label><input id="showSupply" type="checkbox"> supply</label>
          <span id="mapHint">Click a province or army.</span>
        </div>
        <div id="mapViewport" class="map-viewport">
          <svg id="worldMap" viewBox="0 0 1200 720" aria-label="Strategic map"></svg>
          <div id="mapTooltip" class="map-tooltip"></div>
        </div>
        <div id="selectionPanel" class="selection-panel">
          <div class="empty">Select a province or army to inspect it.</div>
        </div>
      </section>

      <section id="politicsTab" class="tabview"></section>
      <section id="researchTab" class="tabview"></section>
      <section id="industryTab" class="tabview"></section>
      <section id="diplomacyTab" class="tabview"></section>
      <section id="warTab" class="tabview"></section><section id="armyTab" class="tabview"></section><section id="airTab" class="tabview"></section><section id="navyTab" class="tabview"></section>
      <section id="ledgerTab" class="tabview"></section>
    </main>

    <aside class="sidebar right">
      <section>
        <div class="panel-title">WORLD SITUATION</div>
        <div id="worldPanel"></div>
      </section>
      <section>
        <div class="panel-title">NEWS</div>
        <div id="newsPanel"></div>
      </section>
      <section>
        <div class="panel-title">CAMPAIGN</div>
        <div class="button-grid">
          <button id="saveBtn" class="button">SAVE</button>
          <button id="loadBtn" class="button">LOAD</button>
          <button id="newBtn" class="button danger">NEW</button>
          <button id="exportBtn" class="button">EXPORT</button>
          <label class="button file-button">IMPORT<input id="importInput" type="file" accept=".json"></label>
        </div>
      </section>
    </aside>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="js/state.js"></script>
<script src="js/map.js"></script>
<script src="js/sim.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
